<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add to the gallery</title>
<style>
body {
  background-color: black;
  color: lightgray;
  font-family: "Courier New", Courier, monospace;
  margin: 1.5em;
}
h1 {
  color: lightblue;
  font-weight: normal;
  font-size: 150%;
  margin: 0 0 0.3em 0;
}
a { color: lightblue; }
#status { margin: 0 0 1em 0; }
#errormessage { color: red; }
.columns {
  display: flex;
  flex-wrap: wrap;
  gap: 2em;
}
.column { width: 400px; }
/* The engine sizes its canvas to this box, and a GIF is cut from the canvas: 400 pixels gives
   pictures the size of those already in the gallery. */
.gameContainer {
  position: relative;
  width: 400px;
  height: 400px;
  border: 1px solid #333;
}
#gameCanvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: black;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}
.row { margin: 0.8em 0; }
label { display: block; margin: 0.8em 0 0.2em 0; }
select, button, input {
  font: inherit;
  color: lightgray;
  background-color: #222;
  border: 1px solid #555;
  padding: 0.3em 0.6em;
}
input { width: 100%; box-sizing: border-box; }
button:disabled { color: #666; border-color: #333; }
button:not(:disabled) { cursor: pointer; }
#preview {
  display: block;
  max-width: 100%;
  image-rendering: pixelated;
  border: 1px solid #333;
}
#preview:not([src]) { display: none; }
#gifinfo, #take, .hint { color: gray; }
</style>
</head>
<body>
<h1>Add to the gallery</h1>
<p id="status">Fetching the game…</p>
<span id="errormessage"></span>
<div class="columns">
  <div class="column">
    <div class="gameContainer"><canvas id="gameCanvas"></canvas></div>
    <div class="row">
      <select id="level" aria-label="Level"></select>
      <button id="again" disabled>Start again</button>
      <button id="make" disabled>Make GIF</button>
    </div>
    <p id="take" data-inputs="[]" data-closed=""></p>
    <p class="hint">Click the game to play it with the keyboard. The GIF is of everything pressed since the level was started.</p>
  </div>
  <div class="column">
    <img id="preview" alt="The GIF of the take">
    <p id="gifinfo"></p>
    <label for="title">Title</label>
    <input id="title" maxlength="100" autocomplete="off">
    <label for="author">Author</label>
    <input id="author" maxlength="100" autocomplete="off">
    <label for="homepage">Homepage (may be left empty)</label>
    <input id="homepage" maxlength="200" autocomplete="off">
    <div class="row"><button id="submit" disabled>Submit to the gallery</button></div>
    <div id="outcome"></div>
  </div>
</div>

<!-- The engine, exactly as play.html loads it, from the PuzzleScript checkout beside the bot. -->
<script src="engine/js/storagewrapper.js"></script>
<script src="engine/js/bitvec.js"></script>
<script src="engine/js/level.js"></script>
<script src="engine/js/languageConstants.js"></script>
<script src="engine/js/globalVariables.js"></script>
<script src="engine/js/debug_off.js"></script>
<script src="engine/js/font.js"></script>
<script src="engine/js/rng.js"></script>
<script src="engine/js/riffwave.js"></script>
<script src="engine/js/sfxr.js"></script>
<script src="engine/js/codemirror/stringstream.js"></script>
<script src="engine/js/colors.js"></script>
<script src="engine/js/graphics.js"></script>
<script src="engine/js/engine.js"></script>
<script src="engine/js/parser.js"></script>
<script src="engine/js/github.js"></script>
<script src="engine/js/compiler.js"></script>
<script src="engine/js/inputoutput.js"></script>
<script src="engine/js/mobile.js"></script>
<!-- The GIF encoder the editor records with. -->
<script src="engine/js/jsgif/LZWEncoder.js"></script>
<script src="engine/js/jsgif/NeuQuant.js"></script>
<script src="engine/js/jsgif/GIFEncoder.js"></script>
<script src="main.js"></script>
</body>
</html>
